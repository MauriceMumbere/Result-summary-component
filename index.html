<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style></style>
  </head>
  <body>
    <main>
      <div>
        <div>
          <div>Your Result</div>
          <div>
            <span>76</span>
            <span>of 100</span>
          </div>
          <div>Great</div>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
        <div>
          <h2>Summary</h2>
          <div>
            <span>Reaction</span>
            <span> 80 / 100</span>
          </div>
          <div>
            <span>Memory</span>
            <span>92 / 100</span>
          </div>
          <div>
            <span>Verbal</span>
            <span>61 / 100</span>
          </div>
          <div>
            <span>Visual</span>
            <span>72 / 100</span>
          </div>
          <div>
            <button>Continue</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>
    <!-- Tailwindcss cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap");
      body {
        background-color: #ecf3ff;
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen flex justify-center items-center p-4">
      <div
        class="grid grid-cols-1 md:grid-cols-2 max-w-[600px] bg-white rounded-3xl shadow-2xl"
      >
        <div
          class="rounded-3xl bg-gradient-to-b from-[#6366F1] to-[#4F46E5] p-7 text-white text-center space-y-4"
        >
          <div class="text-gray-200/60 text-2xl">Your Result</div>
          <div class="flex justify-center">
            <div
              class="h-[150px] w-[150px] flex flex-col justify-center items-center bg-gradient-to-b from-[#2421CA] to-[#4F46E5] rounded-full shadow-sm"
            >
              <p class="text-5xl font-bold">76</p>
              <p class="text-gray-200/60">of 100</p>
            </div>
          </div>
          <div class="font-bold text-2xl">Great</div>
          <p class="text-[18px] text-gray-200/60">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
        <div class="p-7 space-y-7">
          <h2 class="font-bold text-2xl p-0 text-[#313c5b]">Summary</h2>
          <div class="space-y-4">
            <div class="flex justify-between bg-red-100/30 p-3 rounded-lg">
              <div class="flex gap-2">
                <img src="./assets/images/icon-reaction.svg" alt="" />
                <span class="font-bold text-[#ff5555]">Reaction</span>
              </div>
              <span class="font-bold">
                80 <span class="text-slate-400">/ 100</span></span
              >
            </div>
            <div class="flex justify-between bg-orange-100/30 p-3 rounded-lg">
              <div class="flex gap-2">
                <img src="./assets/images/icon-memory.svg" alt="" />
                <span class="font-bold text-[#ffb21e]">Memory</span>
              </div>
              <span class="font-bold"
                >92 <span class="text-slate-400">/ 100</span></span
              >
            </div>
            <div class="flex justify-between bg-green-100/30 p-3 rounded-lg">
              <div class="flex gap-2">
                <img src="./assets/images/icon-verbal.svg" alt="" />
                <span class="font-bold text-[#00bb8f]">Verbal</span>
              </div>
              <span class="font-bold"
                >61 <span class="text-slate-400">/ 100</span></span
              >
            </div>
            <div class="flex justify-between bg-blue-100/30 p-3 rounded-lg">
              <div class="flex gap-2">
                <img src="./assets/images/icon-visual.svg" alt="" />
                <span class="font-bold text-[#1125d6]">Visual</span>
              </div>
              <span class="font-bold"
                >72 <span class="text-slate-400">/ 100</span></span
              >
            </div>
          </div>
          <div>
            <button
              class="bg-[#313c5b] p-2 rounded-full w-full cursor-pointer font-bold text-white"
            >
              Continue
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
